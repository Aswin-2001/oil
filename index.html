const STEPS=["Order placed","Payment verified","Packed","Dispatched"];
const stepIdx=o=>o.status==="Cancelled"||o.pay==="Rejected"?-1:o.pay!=="Verified"?0:({Placed:1,Packed:2,Dispatched:3}[o.status]||1);
const eta=o=>{const b=o.dispAt||o.created;return fd(b+5*864e5,{day:"numeric",month:"short"})+" – "+fd(b+7*864e5)};
function timeline(o){const i=stepIdx(o);let h="";
if(o.status==="Cancelled")h+='<p class="note w">This order was cancelled.</p>';else if(o.pay==="Rejected")h+='<p class="note w">We could not verify your payment. Please call us with your reference number.</p>';
h+=`<ul class="tl">${STEPS.map((s,k)=>`<li class="${k<=i?"done":""}" style="--i:${k}">${T(s)}</li>`).join("")}</ul>`;
if(o.status==="Dispatched")h+=`<p class="note">🚚 Dispatched. Expected delivery in 5–7 days: <b>${eta(o)}</b>.${o.courier?`<br>Courier / tracking: <b>${esc(o.courier)}</b>`:""}</p>`;
else if(o.status!=="Cancelled"&&o.pay!=="Rejected")h+='<p class="note">Delivery usually takes 5–7 days after dispatch. We update this page when your order is packed and dispatched.</p>';return h}

$("#atab").innerHTML=`${warn}<div class="stats"><div class="stat"><b data-n="${all.length}">${all.length}</b><span>Total orders</span></div><div class="stat"><b data-n="${pend}">${pend}</b><span>Payments to verify</span></div><div class="stat"><b data-n="${rev}" data-pre="₹">${inr(rev)}</b><span>Verified revenue</span></div><div class="stat"><b data-n="${act}">${act}</b><span>Active orders</span></div></div>
<div class="panel"><div class="row" style="flex-wrap:wrap"><h3 style="margin:0">Orders</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="qs" placeholder="Search ID, name, mobile, ref" value="${esc(qs)}" style="width:220px"><select id="flt" style="width:auto">${["All","Pending payment","Placed","Packed","Dispatched","Cancelled"].map(s=>`<option${s===filt?" selected":""}>${s}</option>`).join("")}</select></div></div><div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ordBody"></tbody></table></div></div>`;drawOrd()}

function tAnalytics(){const all=orders(),M={},PR={},MT={};
all.forEach(o=>{const d=new Date(o.created),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");const m=M[k]||(M[k]={n:0,paid:0,pend:0,canc:0});
if(o.status==="Cancelled"){m.canc++;return}m.n++;if(o.pay==="Verified")m.paid+=o.total;else if(o.pay==="Pending")m.pend+=o.total;
o.items.forEach(i=>{const p=PR[i.name]||(PR[i.name]={q:0,r:0});p.q+=i.qty;p.r+=i.price*i.qty});MT[o.method]=(MT[o.method]||0)+1});
const ks=Object.keys(M).sort().slice(-12),lab=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleString("en-IN",{month:"short",year:"2-digit"});

function readQr(f,mx){return new Promise((res,rej)=>{if(!/^image\//.test(f.type)||f.size>8e6)return rej();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,(mx||520)/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*m);cv.height=Math.round(im.height*m);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",mx?.85:.92))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}

/* ---------- draft & publish ---------- */
function setCtx(c){if(ctx!==c){ctx=c;loadP()}}
const strip=c=>{const x={...c};delete x.admins;return JSON.stringify(x)};
function isDirty(){const dc=S.get("sf_cfg_d",null),dp=S.get("sf_prod2_d",null);return!!((dc&&strip(dc)!==strip(S.get("sf_cfg",{})))||(dp&&JSON.stringify(dp)!==JSON.stringify(S.get("sf_prod2",null)||DEFP)))}
const pubMsg=()=>isDirty()?"🟡 <b>Unpublished changes</b> — customers can't see them yet. Click Save &amp; Publish.":"🔵 Everything is published and live.";
function refreshPub(){const adm=ctx==="draft"&&!!adminUser();const e=$("#pubst");if(e)e.innerHTML=pubMsg();const f=$("#pubfl");if(f)f.classList.toggle("hide",!(adm&&isDirty()));const w=$("#waBtn");if(w)w.classList.toggle("hide",adm&&location.hash==="#admin")}
const pubBar=()=>`<div class="panel" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px"><span id="pubst">${pubMsg()}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn alt sm" href="#preview">👁 Preview</a><button class="btn alt sm" data-discard>Discard changes</button><button class="btn" data-publish>💾 Save &amp; Publish</button></div></div>`;
const toAdmin=()=>{if(location.hash==="#admin")admin();else location.hash="#admin"};
function publish(){const dc=S.get("sf_cfg_d",null),dp=S.get("sf_prod2_d",null);
if(!dc&&!dp){toast("Nothing new to publish");return}
if(dc){dc.admins=S.get("sf_cfg",{}).admins;if(!S.set("sf_cfg",dc))return}
if(dp&&!S.set("sf_prod2",dp))return;
S.del("sf_cfg_d");S.del("sf_prod2_d");loadP();applyBiz();toast("Published! Your changes are now live on the website.");toAdmin()}
function discard(){S.del("sf_cfg_d");S.del("sf_prod2_d");loadP();toast("Draft discarded");toAdmin()}

function doSearch(v){const q=v.trim().toLowerCase(),box=$("#sres");if(q.length<2){box.classList.add("hide");return}
const m=P.filter(p=>p.avail!==false&&(p.name+" "+(p.tag||"")).toLowerCase().indexOf(q)>-1).slice(0,8);
box.innerHTML=m.length?m.map(p=>`<div class="sr"><span>${esc(p.e||"")} ${esc(p.name)}<br><small>${esc(p.size)} · ${inr(p.price)}</small></span><button class="btn sm" data-addq="${esc(p.id)}">Add</button><button class="btn alt sm" data-view="${esc(p.id)}">View</button></div>`).join(""):'<div class="sr"><span>No products found</span></div>';box.classList.remove("hide")}

else{if(!$("#top")||shopCtx!==ctx)shop();const el=document.getElementById(h.slice(1));if(el)el.scrollIntoView();else window.scrollTo(0,0);return}
window.scrollTo(0,0)}

else if(x.id==="galf"&&x.files[0]){if(cfg().gallery.length>=6){setErr("gal","Maximum 6 photos");return}readQr(x.files[0],700).then(u=>{patchCfg(c=>{c.gallery=(c.gallery||[]).concat(u)});tAccess()},()=>setErr("gal","Please choose an image under 8 MB"))}
else if(x.id==="pimg"&&x.files[0]){const p=byId(x.form.getAttribute("data-id"));readQr(x.files[0],700).then(u=>{p.img=u;saveP();$("#pdprev").innerHTML='<img src="'+u+'" alt="">';toast("Photo saved")},()=>setErr("pimg","Please choose an image under 8 MB"))}
else if(x.id==="certf"&&x.files[0])readQr(x.files[0],1400).then(u=>{patchCfg(c=>{c.fssaiImg=u});applyBiz();toast("Certificate uploaded");tAccess()},()=>setErr("cert","Please choose an image file under 8 MB"));
else if(x.id==="qrf"&&x.files[0])readQr(x.files[0]).then(u=>{patchCfg(c=>{c.qrImg=u});toast("QR updated");tPay()},()=>setErr("qr","Please choose an image file under 8 MB"))});
document.addEventListener("input",e=>{if(e.target.id==="sq")doSearch(e.target.value);else if(e.target.id==="qs"){qs=e.target.value.trim();drawOrd()}else if(e.target.id==="fz"){const v=e.target.value.trim();setErr("fz",/^\d{6}$/.test(v)&&!pinOk(v)?"Sorry, we don't deliver to this PIN code yet":"")}});
document.addEventListener("submit",e=>{const f=e.target;
if(f.id==="pf"){e.preventDefault();const g=i=>$("#"+i).value.trim();
if(!/^[\w.\-]{2,}@[a-zA-Z0-9]{2,}$/.test(g("s_upi")))return setErr("set","Enter a valid UPI ID like name@bank");
if(g("s_ship")===""||Number(g("s_ship"))<0)return setErr("set","Delivery charge must be 0 or more");if(!/^[\d,\s]*$/.test(g("s_pins")))return setErr("set","PIN list can only have digits, commas and spaces");
patchCfg(c=>{c.upi=g("s_upi");c.payee=g("s_payee")||DEF.payee;c.ship=Math.round(Number(g("s_ship")));c.free=Math.max(0,Math.round(Number(g("s_free"))||0));c.pins=g("s_pins");c.bank={holder:g("s_h"),acc:g("s_acc"),ifsc:g("s_ifsc").toUpperCase(),name:g("s_bn"),branch:g("s_br")}});toast("Payment details saved");tPay()}
else if(f.id==="bf"){e.preventDefault();const g=i=>$("#"+i).value.trim();if(g("b_name").length<2)return setErr("biz","Enter the business name");if(g("b_email")&&!/^\S+@\S+\.\S+$/.test(g("b_email")))return setErr("biz","Enter a valid email");if(g("b_fssai")&&!/^\d{14}$/.test(g("b_fssai")))return setErr("biz","FSSAI licence number must be exactly 14 digits");if(!/^\d{10,15}$/.test(g("b_wa").replace(/\D/g,"")))return setErr("biz","Enter a valid WhatsApp number with country code");
patchCfg(c=>{c.biz={name:g("b_name"),addr:g("b_addr"),phone:g("b_phone"),email:g("b_email"),gstin:g("b_gst"),fssai:g("b_fssai"),whatsapp:g("b_wa").replace(/\D/g,""),retHrs:Math.max(1,Math.round(Number(g("b_ret"))||48)),note:g("b_note")}});applyBiz();toast("Business details saved");tAccess()}
else if(f.id==="pdf"){e.preventDefault();const p=byId(f.getAttribute("data-id")),g=i=>$("#"+i).value.trim();if(!p)return;const mrp=Math.round(Number(g("d_mrp"))||0);if(mrp&&mrp<p.price)return setErr("pd","MRP can't be lower than the selling price ("+inr(p.price)+")");p.mrp=mrp||undefined;p.badge=g("d_bdg")||undefined;p.shelf=g("d_shelf");p.ing=g("d_ing");p.sto=g("d_sto");p.nutri=g("d_nut");saveP();$("#pdm").classList.add("hide");toast("Product details saved");if(atab==="products"&&adminUser())tProducts()}
else if(f.id==="rf"){e.preventDefault();const n=$("#r_n").value.trim(),t=$("#r_t").value.trim();if(n.length<2||t.length<5)return setErr("rev","Enter the customer's name and review text");patchCfg(c=>{c.reviews=(c.reviews||[]).concat({n,t,s:+$("#r_s").value})});toast("Review added");tAccess()}
else if(f.id==="wf"){e.preventDefault();const g=i=>$("#"+i).value.trim();if(g("w_n").length<2||g("w_i").length<2)return setErr("wh","Please enter your name and the products you need");if(!/^[6-9]\d{9}$/.test(g("w_p")))return setErr("wh","Enter a valid 10-digit mobile number");
const q={id:"W"+Date.now().toString(36),t:Date.now(),name:g("w_n"),biz:g("w_b"),phone:g("w_p"),city:g("w_c"),item:g("w_i"),qty:g("w_q"),msg:g("w_m")};S.set("sf_enq",[q].concat(S.get("sf_enq",[])));
$("#app").innerHTML=`<div class="panel" style="text-align:center;max-width:560px;margin:auto"><div class="okc">🎉</div><h2 style="margin:0">Enquiry received</h2><p class="sub">Thank you, ${esc(q.name)}. For a faster reply, send it to us on WhatsApp too.</p><p><a class="btn" target="_blank" rel="noopener" href="${waLink("Wholesale enquiry\nName: "+q.name+"\nBusiness: "+q.biz+"\nPhone: "+q.phone+"\nCity: "+q.city+"\nProducts: "+q.item+"\nQuantity: "+q.qty+"\n"+q.msg)}">💬 Send on WhatsApp</a> <a class="btn alt" href="#top">Back to shop</a></p></div>`}
else if(f.id==="af"){e.preventDefault();const u=$("#a_u").value.trim(),p=$("#a_p").value;if(!/^[A-Za-z0-9_.-]{3,20}$/.test(u))return setErr("acc","Username: 3–20 letters, numbers, . _ -");if(p.length<8)return setErr("acc","Password must be at least 8 characters");
hashPw(u,p).then(h=>{patchCfg(c=>{c.admins=(c.admins||[]).filter(a=>a.u.toLowerCase()!==u.toLowerCase());c.admins.push({u,h})},true);toast("Admin saved");tAccess()})}});
$("#scrim").addEventListener("click",()=>openCart(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#sres").classList.add("hide");openCart(false);$("#invm").classList.add("hide");$("#certm").classList.add("hide");$("#pm").classList.add("hide");$("#pdm").classList.add("hide")}});
window.addEventListener("hashchange",route);
applyBiz();applyLang();count();route();
})();
</script>
</body>
